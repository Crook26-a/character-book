<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character Book</title>
<meta name="description" content="A character sheet you play from: rolls, hit points, spells, what you carry, and who you've met.">
<meta name="theme-color" content="#3a2e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Character Book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
<style>
  /* the same aged plat sheet as Ordinate Survey and the Field Book: rag paper, iron-gall ink, red lead for the marks */
  :root {
    --paper: #e5d7b4; --paper-lit: #eee3c7; --paper-deep: #d6c49c; --card: #f3eacf;
    --ink: #3a2e1e; --ink-soft: #6d5c43; --ink-faint: #9b8968; --rule: #bfab84; --rule-soft: #cdbb98;
    --lead: #a8331f; --lead-soft: #f0d9c8; --good: #5e7a4e; --good-soft: #dfe6cf; --gold: #9a7417;
  }
  body.dark {
    --paper: #1d1912; --paper-lit: #272118; --paper-deep: #15120d; --card: #2a2419;
    --ink: #eadfc4; --ink-soft: #bba985; --ink-faint: #8a7a5c; --rule: #4a3f2d; --rule-soft: #3a3124;
    --lead: #e0785f; --lead-soft: #3d2620; --good: #93b07f; --good-soft: #26301f; --gold: #d8b25a;
  }
  * { box-sizing: border-box; }
  button, .tab { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  html, body { overscroll-behavior-y: none; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 1.35;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, rgba(191,171,132,.28) 27px, rgba(191,171,132,.28) 28px);
  }
  body.dark { background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, rgba(74,63,45,.45) 27px, rgba(74,63,45,.45) 28px); }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px 14px calc(96px + env(safe-area-inset-bottom)); }
  .mono, .caps { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .caps { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: var(--ink-soft); }

  header { border-bottom: 3px double var(--ink); padding-bottom: 10px; margin-bottom: 0; }
  .headrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #who { background: none; border: 0; padding: 0; color: var(--ink); font: inherit; text-align: left; cursor: pointer; min-width: 0; }
  #who b { display: block; font-size: 26px; line-height: 1.05; font-weight: normal; overflow-wrap: anywhere; }
  #who b::after { content: " ▾"; font-size: 15px; color: var(--ink-faint); }
  #who small { display: block; margin-top: 3px; }
  #themeBtn, #editBtn, #syncBtn { flex: none; background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: 3px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer; }
  #editBtn.on { background: var(--lead); border-color: var(--lead); color: #fff; }
  /* edit mode: everything you put in is a field */
  .editing-bar { background: var(--lead-soft); border: 1px dashed var(--lead); border-radius: 3px; padding: 8px 10px; margin: 0 0 12px; font-size: 14px; }

  /* the strip: hit points, concentration and the next roll's advantage, always in sight */
  #strip { position: sticky; top: 0; z-index: 8; background: var(--paper); margin: 0 -14px 12px; padding: calc(8px + env(safe-area-inset-top)) 14px 8px;
    border-bottom: 1px solid var(--rule); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #strip .hp { font-size: 19px; white-space: nowrap; }
  #strip .hp small { font-size: 13px; color: var(--ink-soft); }
  #strip .tmp { color: var(--good); font-size: 14px; }
  #strip .sp { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--rule); background: var(--card); border-radius: 14px; padding: 3px 10px;
    font: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer; min-height: 30px; }
  .chip.on { background: var(--ink); color: var(--paper-lit); border-color: var(--ink); }
  .chip.lead { border-color: var(--lead); color: var(--lead); }
  .chipgrp { display: inline-flex; }
  .chipgrp .chip:first-child { border-radius: 14px 0 0 14px; }
  .chipgrp .chip.info { border-radius: 0 14px 14px 0; border-left: 0; padding: 3px 8px; color: var(--ink-soft); }
  .chipgrp .chip.info.on { color: var(--paper-lit); }
  .chip.goodc { border-color: var(--good); color: var(--good); }
  .chip.off { opacity: .5; text-decoration: line-through; }
  .chip .x { color: var(--ink-faint); margin-left: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--paper-lit); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 3px; padding: 10px 12px; font: inherit; font-size: 15px; cursor: pointer; min-height: 44px; }
  .btn:active { background: var(--paper-deep); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.wide { width: 100%; margin: 0 0 10px; }
  .btn.main { background: var(--ink); color: var(--paper-lit); border-color: var(--ink); }
  .btn.danger { color: var(--lead); border-color: var(--lead); }
  .btn.good { color: var(--good); border-color: var(--good); }
  .btn.small { min-height: 36px; padding: 6px 10px; font-size: 14px; }
  .btn.tiny { min-height: 30px; padding: 3px 8px; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .row > * { min-width: 0; }
  .grow { flex: 1; }

  input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 9px 10px; }
  textarea { resize: vertical; min-height: 70px; }
  select { padding: 8px 6px; }
  .fld { display: block; margin: 0 0 10px; flex: 1; }
  .fld > span { display: block; margin: 0 0 3px; }
  .fld > span, .lab { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .1em; font-size: 10.5px; color: var(--ink-soft); }
  .fld.n { flex: 0 0 84px; }
  .check { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; font-size: 15px; }
  .check input { width: 22px; height: 22px; flex: none; }
  .note { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 10px; }
  .warn { color: var(--lead); font-size: 13.5px; margin: 0 0 10px; }
  .empty { text-align: center; color: var(--ink-soft); padding: 22px 10px; font-style: italic; }

  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 12px 12px 4px; margin: 0 0 14px; }
  .panel.artifact { border: 2px solid var(--gold); }
  .panel h2 { margin: 0 0 8px; font-size: 19px; font-weight: normal; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .panel h2 small { font-size: 12px; color: var(--ink-soft); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  .panel h3 { margin: 10px 0 6px; font-size: 16px; font-weight: normal; border-bottom: 1px solid var(--rule-soft); padding-bottom: 3px; }
  details.sec { border-top: 1px solid var(--rule); padding: 6px 0 2px; margin: 4px 0 6px; }
  details.sec > summary { cursor: pointer; list-style: none; padding: 6px 0; font-size: 17px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: "▸ "; color: var(--ink-faint); }
  details.sec[open] > summary::before { content: "▾ "; }
  details.sec > summary small { color: var(--ink-soft); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; margin-left: 4px; }

  /* hit points */
  .hpbig { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .hpbig .cur { font-size: 40px; line-height: 1; }
  .hpbig .max { font-size: 20px; color: var(--ink-soft); }
  .hpbar { height: 8px; border-radius: 4px; background: var(--paper-deep); overflow: hidden; margin: 0 0 10px; display: flex; }
  .hpbar i { display: block; background: var(--good); }
  .hpbar i.t { background: var(--gold); }
  .hpbar.low i:first-child { background: var(--lead); }

  /* numbers you tap to roll */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 12px; }
  .stat { background: var(--card); border: 1px solid var(--rule); border-radius: 3px; padding: 6px 4px; text-align: center; font: inherit; color: var(--ink); }
  button.stat { cursor: pointer; }
  .stat b { display: block; font-size: 21px; font-weight: normal; line-height: 1.1; }
  .stat small { display: block; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
  .stat em { display: block; font-style: normal; font-size: 11px; color: var(--good); }
  .abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin: 0 0 12px; }
  .abil .stat b { font-size: 22px; }
  .abil .stat .sc { font-size: 12px; color: var(--ink-soft); }
  .lines { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; margin: 0 0 10px; }
  .line { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; border-bottom: 1px dotted var(--rule); color: var(--ink); font: inherit;
    padding: 7px 2px; text-align: left; cursor: pointer; min-height: 38px; }
  .line .v { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; min-width: 30px; text-align: right; }
  .line .nm { flex: 1; }
  .line .pf { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink-soft); flex: none; }
  .line .pf.on { background: var(--ink); }
  .line .pf.ex { background: var(--lead); border-color: var(--lead); }
  .line small { color: var(--ink-soft); font-size: 12px; }

  /* attacks, spells, items as rows */
  .card { display: block; width: 100%; text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px;
    padding: 10px 12px; margin: 0 0 8px; font: inherit; position: relative; }
  .card.tap { cursor: pointer; }
  .card.gone { opacity: .55; }
  .card.cur { border: 2px solid var(--gold); }
  .card .nm { font-size: 17px; overflow-wrap: anywhere; }
  .card .sub { display: block; margin-top: 3px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink-soft); }
  .card .txt { margin: 6px 0 4px; font-size: 14.5px; }
  .card .txt p { margin: 0 0 6px; }
  .card .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .card .tag { display: inline-block; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10.5px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; margin-left: 4px; color: var(--ink-soft); vertical-align: middle; }
  .card .tag.c { border-color: var(--lead); color: var(--lead); }
  .card .tag.g { border-color: var(--gold); color: var(--gold); }
  .atkrow { display: flex; align-items: center; gap: 8px; }
  .atkrow .nm { flex: 1; }
  .big { font-size: 20px; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }

  /* pips: slots, luck, points */
  .res { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dotted var(--rule); flex-wrap: wrap; }
  .res .nm { flex: 1; min-width: 130px; }
  .res .nm small { display: block; color: var(--ink-soft); font-size: 12px; }
  .pips { display: flex; gap: 5px; flex-wrap: wrap; }
  .pip { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); background: var(--ink); cursor: pointer; padding: 0; }
  .pip.used { background: transparent; border-color: var(--ink-faint); }
  .pip.sq { border-radius: 4px; }
  .death { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 0 0 10px; }
  .death .pip { background: transparent; border-color: var(--ink-faint); }
  .death .ok .pip.f { background: var(--good); border-color: var(--good); }
  .death .bad .pip.f { background: var(--lead); border-color: var(--lead); }

  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .thumbs img { width: 76px; height: 76px; object-fit: cover; border: 1px solid var(--rule); border-radius: 3px; cursor: zoom-in; background: var(--paper-deep); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 4px 0 10px; }
  .tbl td, .tbl th { border: 1px solid var(--rule); padding: 4px 6px; vertical-align: top; text-align: left; }
  .tbl th { background: var(--paper-deep); font-weight: normal; }
  .tbl tr.hit td { background: var(--lead-soft); }
  .logl { font-size: 14px; padding: 5px 0; border-bottom: 1px dotted var(--rule); display: flex; gap: 8px; }
  .logl .d { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink-soft); flex: none; width: 82px; padding-top: 2px; }
  .logl .t { flex: 1; overflow-wrap: anywhere; }
  .purse { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 0 0 10px; }
  .purse label { text-align: center; }
  .purse input { text-align: center; padding: 8px 2px; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
  .seg button { background: var(--paper-lit); border: 0; border-right: 1px solid var(--rule); font: inherit; font-size: 14px; color: var(--ink); padding: 7px 11px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--ink); color: var(--paper-lit); }

  /* bottom tabs */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--paper-lit); border-top: 3px double var(--ink);
    padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1 1 0; min-width: 0; background: none; border: 0; color: var(--ink-soft); font: inherit; font-size: 14px; padding: 10px 1px 12px; min-height: 58px; position: relative; cursor: pointer; }
  nav.tabs button.on { color: var(--ink); }
  nav.tabs button.on::after { content: ""; position: absolute; left: 22%; right: 22%; top: 0; height: 3px; background: var(--lead); }
  nav.tabs small { display: block; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* the roll, and anything else that comes up over the page */
  #ov { position: fixed; inset: 0; z-index: 40; background: rgba(20,15,8,.6); display: flex; align-items: flex-end; justify-content: center; }
  #ov[hidden] { display: none; }
  #ov .box { background: var(--paper); width: min(680px, 100%); max-height: 92vh; overflow: auto; border-top: 3px double var(--ink); border-radius: 6px 6px 0 0;
    padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); }
  #ov .box.pic { background: #000; padding: 8px; text-align: center; }
  #ov .box.pic img { max-width: 100%; max-height: 80vh; }
  /* the gear shop, with colours of its own, the same in light and dark. Joseph's picture of Vorsk at the stall fills
     it (2026-11-03: "this is what I want, and then the box of items would be on the left"), framed so Vorsk stands on
     the right; the box of wares floats on the left, like a Skyrim shop, and scrolls on its own */
  html.shopping { overflow: hidden; }   /* the shop has the whole screen, no page scrollbar beside it */
  #ov .box.shop { padding: 0; border: 0; border-radius: 0; color: #e9e2cf; width: 100%; max-width: none; height: 100vh; height: 100dvh; max-height: none; overflow: hidden; background: #2a2418; }
  .px-shop { position: relative; height: 100%; font-family: 'Pixelify Sans', ui-monospace, Menlo, Consolas, monospace; font-size: 15px;
    background: #2a2418 url("pictures/vorsk-stall.jpg") 37% 50% / cover no-repeat; image-rendering: pixelated; }
  @media (min-width: 560px) { .px-say { font-size: 14px; } }
  .px-shop svg { display: block; }
  /* the box of wares */
  .px-box { position: absolute; left: 8px; top: calc(8px + env(safe-area-inset-top)); bottom: calc(8px + env(safe-area-inset-bottom)); width: min(58%, 420px); display: flex; flex-direction: column;
    background: rgba(12, 14, 26, .93); box-shadow: -3px 0 0 0 #0a0b14, 3px 0 0 0 #0a0b14, 0 -3px 0 0 #0a0b14, 0 3px 0 0 #0a0b14, inset 0 0 0 1px #3a4270; image-rendering: auto; }
  .px-boxhead { flex: none; background: #10121f; border-bottom: 2px solid #3a4270; }
  .px-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .px-counter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 7px 8px 2px; }
  .px-gold { font-size: 18px; color: #ffd23f; text-shadow: 2px 2px 0 #000; }
  .px-counter small { color: #b9b3a0; }
  .px-tabs { display: flex; gap: 6px; padding: 6px 8px 8px; }
  .px-tab { flex: 1; font: inherit; font-size: 14px; padding: 4px 0; border: 0; background: #1c2038; color: #c9c3b0; cursor: pointer;
    box-shadow: -2px 0 0 0 #3a4270, 2px 0 0 0 #3a4270, 0 -2px 0 0 #3a4270, 0 2px 0 0 #3a4270; }
  .px-tab.on { background: #2f66d0; color: #fbf3dc; box-shadow: -2px 0 0 0 #6fa3f5, 2px 0 0 0 #6fa3f5, 0 -2px 0 0 #6fa3f5, 0 2px 0 0 #6fa3f5; }
  .px-body { padding: 2px 8px 10px; }
  .px-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 4px; }
  .px-filters input#shopQ, .px-filters select { font: inherit; flex: 1 1 120px; min-width: 0; background: #1c2038; color: #e9e2cf; border: 0; padding: 5px 7px; border-radius: 0;
    box-shadow: -2px 0 0 0 #3a4270, 2px 0 0 0 #3a4270, 0 -2px 0 0 #3a4270, 0 2px 0 0 #3a4270; }
  .px-filters input#shopQ::placeholder { color: #8a8574; }
  .px-check { display: flex; gap: 6px; align-items: flex-start; font-size: 14px; line-height: 1.2; }
  .px-kind { margin: 12px 0 2px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8fb4ff; border-bottom: 1px solid #3a4270; padding-bottom: 2px; }
  .px-kind.px-free { color: #93d07f; }
  .px-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid rgba(255, 255, 255, .07); }
  .px-row.dim .px-nm, .px-row.dim .px-pr { opacity: .45; }
  .px-row.px-total { border-top: 2px solid #3a4270; border-bottom: 0; font-size: 17px; }
  .px-ic { flex: none; font-style: normal; }
  .px-nm { flex: 1; min-width: 0; line-height: 1.2; overflow-wrap: anywhere; }
  .px-nm small { color: #b9a888; display: block; font-size: 12px; }
  .px-pr { flex: none; color: #ffd23f; text-align: right; font-size: 14px; }
  .px-pr s { color: #8a8574; }
  .px-nm .px-pr { display: block; text-align: left; font-size: 13px; margin-top: 1px; }
  .px-nm .px-pr small { display: inline; color: #b9a888; }
  .px-ok { color: #93d07f; }
  .px-n { min-width: 14px; text-align: center; }
  .px-btn { font: inherit; flex: none; border: 0; cursor: pointer; padding: 3px 8px; margin: 3px; background: #ffd23f; color: #14182e;
    box-shadow: -3px 0 0 0 #000, 3px 0 0 0 #000, 0 -3px 0 0 #000, 0 3px 0 0 #000, inset -3px -3px 0 0 #b07d1a; }
  .px-btn:active { transform: translateY(2px); box-shadow: -3px 0 0 0 #000, 3px 0 0 0 #000, 0 -3px 0 0 #000, 0 3px 0 0 #000, inset 3px 3px 0 0 #b07d1a; }
  .px-btn.px-take { background: #93d07f; box-shadow: -3px 0 0 0 #000, 3px 0 0 0 #000, 0 -3px 0 0 #000, 0 3px 0 0 #000, inset -3px -3px 0 0 #4c8a3c; }
  .px-btn.small { padding: 1px 7px; }
  .px-btn.px-done { margin: 0 3px 0 auto; padding: 2px 8px; font-size: 13px; background: #2f66d0; color: #fbf3dc;
    box-shadow: -3px 0 0 0 #000, 3px 0 0 0 #000, 0 -3px 0 0 #000, 0 3px 0 0 #000, inset -3px -3px 0 0 #1f3f8f; }
  .px-note { font-size: 13.5px; color: #b9b3a0; margin: 8px 8px 0; line-height: 1.3; }
  .px-body .px-note { margin: 12px 0 0; }
  .px-body .px-dm, .px-body .px-owed { margin: 6px 0 8px; padding: 6px 8px; background: #1a2240; border-left: 4px solid #6fa3f5; color: #d9d3c0; }
  .px-body .px-owed { background: #1d2b1c; border-left-color: #93d07f; }
  .pk-desc { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--rule-soft); font-size: 15px; }
  .px-none { padding: 14px 0; text-align: center; color: #b9b3a0; }
  .px-nm[data-act] { cursor: pointer; }
  .px-nm[aria-expanded="true"] { color: #8fb4ff; }
  .px-desc { margin: 0 0 6px 30px; padding: 6px 8px; background: #161a30; border-left: 3px solid #3a4270; font-size: 13.5px; line-height: 1.35; color: #d9d3c0; }

<script>
"use strict";
/* ══ Character Book — the sheet you play from, beside Ordinate Survey (the DM's app) and the Field Book.
   Everything stays on this device (localStorage; pictures in IndexedDB) until you save a backup from the character menu.
   Rules are the ones on your sheet: Gnick is a 2014 character, so his spells and features read as he has them written. ══ */
const VERSION = 55;
let offlineReady = false; // set once the offline cache for this version is in place
const STORE = "character-book";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));

const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

/* ── rules tables (2014 Player's Handbook wording, as Gnick's sheet uses) ── */
const ABS = [["str", "Strength"], ["dex", "Dexterity"], ["con", "Constitution"], ["int", "Intelligence"], ["wis", "Wisdom"], ["cha", "Charisma"]];
const AB_NAME = Object.fromEntries(ABS);
const AB_SHORT = { str: "Str", dex: "Dex", con: "Con", int: "Int", wis: "Wis", cha: "Cha" };
const SKILLS = [["acrobatics", "Acrobatics", "dex"], ["animal", "Animal Handling", "wis"], ["arcana", "Arcana", "int"], ["athletics", "Athletics", "str"],
  ["deception", "Deception", "cha"], ["history", "History", "int"], ["insight", "Insight", "wis"], ["intimidation", "Intimidation", "cha"],
  ["investigation", "Investigation", "int"], ["medicine", "Medicine", "wis"], ["nature", "Nature", "int"], ["perception", "Perception", "wis"],
  ["performance", "Performance", "cha"], ["persuasion", "Persuasion", "cha"], ["religion", "Religion", "int"], ["sleight", "Sleight of Hand", "dex"],
  ["stealth", "Stealth", "dex"], ["survival", "Survival", "wis"]];
const SKILL = Object.fromEntries(SKILLS.map(s => [s[0], { name: s[1], ab: s[2] }]));
const CONDITIONS = {
  Blinded: "Can't see; fails any check that needs sight. Attacks against you have advantage; your attacks have disadvantage.",

  Frightened: "Disadvantage on ability checks and attacks while the source is in sight; can't willingly move closer to it.",

  Incapacitated: "No actions or reactions.",

  Poisoned: "Disadvantage on attack rolls and ability checks.",
  Prone: "Your attacks have disadvantage. Attacks within 5 ft have advantage against you, farther ones disadvantage.",
  Restrained: "Speed 0. Your attacks and Dex saves have disadvantage; attacks against you have advantage.",
  Stunned: "Incapacitated, can't move, speaks falteringly. Fails Str and Dex saves. Attacks against you have advantage.",
  Unconscious: "Incapacitated, can't move or speak, drops what it holds, falls prone. Fails Str and Dex saves. Attacks against you have advantage; hits from within 5 ft are critical."
};
const EXHAUSTION = ["None", "Disadvantage on ability checks", "Speed halved", "Disadvantage on attack rolls and saving throws", "Hit point maximum halved", "Speed reduced to 0", "Death"];
// What an effect can add to: the words people pick from when they make their own
const TARGETS = [["atk", "Attack rolls"], ["satk", "Spell attacks"], ["watk", "Weapon attacks"], ["dmg", "Damage"], ["save", "Saving throws"], ["check", "Ability checks"],
  ["init", "Initiative"], ["ac", "Armor Class"], ["dc", "Spell save DC"], ["hpmax", "Hit point maximum"], ["speed", "Speed"]];
const PRESETS = [
  { name: "Bless", to: ["atk", "save"], bonus: "1d4", conc: true, note: "1 minute" },
  { name: "Bane", to: ["atk", "save"], bonus: "-1d4", note: "Someone's spell on you" },
  { name: "Guidance", to: ["check"], bonus: "1d4", once: true, note: "One ability check" },
  { name: "Resistance", to: ["save"], bonus: "1d4", once: true, note: "One saving throw" },
  { name: "Shield of Faith", to: ["ac"], bonus: "2", note: "Someone's concentration" },
  { name: "Aid", to: ["hpmax"], bonus: "5", until: "long", note: "8 hours" },
  { name: "Pass without Trace", to: ["skill:stealth"], bonus: "10", note: "1 hour" },
  { name: "Blessing of the Trickster", adv: ["skill:stealth"], note: "Advantage on Stealth, 1 hour" },
  { name: "Mirror Image", note: "3 duplicates, 1 minute", dupes: 3 },
  { name: "Blink", note: "1 minute: a d6 at the end of each of your turns", blink: true, self: true },
  { name: "Inspiration", note: "Spend it for advantage on one roll" }
];

/* ── dice ── */
const rnd = n => 1 + Math.floor(Math.random() * n);
function parseDice(expr) {
  const terms = []; const s = String(expr || "").replace(/\s+/g, "").replace(/−/g, "-");
  const re = /([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/gi; let m;
  while ((m = re.exec(s))) {
    if (m[3]) terms.push({ sign: m[1] === "-" ? -1 : 1, n: +(m[2] || 1), d: +m[3] });
    else terms.push({ sign: m[4] === "-" ? -1 : 1, k: +m[5] });
  }
  return terms;
}
function rollExpr(expr, crit) {
  let total = 0; const parts = [];
  for (const t of parseDice(expr)) {
    if (t.d) { const n = t.n * (crit ? 2 : 1); const rs = Array.from({ length: n }, () => rnd(t.d)); const v = rs.reduce((a, b) => a + b, 0) * t.sign;
      total += v; parts.push(`${t.sign < 0 ? "−" : ""}${n}d${t.d} [${rs.join(",")}]`); }
    else { total += t.k * t.sign; parts.push(sg(t.k * t.sign)); }
  }
  return { total, text: parts.join(" ") };
}
const isDice = b => /d/i.test(String(b || ""));
const flatOf = b => isDice(b) ? 0 : (parseInt(String(b).replace(/−/g, "-"), 10) || 0);
const addDice = (a, b) => !b ? a : !a ? b : (a + (/^[+-]/.test(b) ? "" : "+") + b);
function scaleDice(expr, times) { // "1d6" × 2 = "2d6"
  if (!times) return ""; return parseDice(expr).map(t => t.d ? `${t.sign < 0 ? "-" : "+"}${t.n * times}d${t.d}` : `${t.sign < 0 ? "-" : "+"}${t.k * times}`).join("").replace(/^\+/, "");
}

/* ── store ── */
let db = (() => { try { const t = localStorage.getItem(STORE); if (t) return JSON.parse(t); } catch (e) {} return null; })();
if (!db || !Array.isArray(db.chars) || !db.chars.length) db = { v: 1, cur: "ch_gnick", chars: [seedGnick()] };
let saveT = null;
function save(now) {
  const go = () => { try { stamp(); localStorage.setItem(STORE, JSON.stringify(db)); } catch (e) { toast("This device wouldn't save. Save a backup from the character menu."); } };
  clearTimeout(saveT); if (now) go(); else saveT = setTimeout(go, 250);
}
window.addEventListener("pagehide", () => save(true));
document.addEventListener("visibilitychange", () => { if (document.hidden) save(true); });
const C = () => db.chars.find(c => c.id === db.cur) || db.chars[0];
const ui = { tab: "play", open: {}, next: null, edit: null, wager: { roll: "", dc: "" }, itemOpen: null, filter: "", pkind: "" };
try { Object.assign(ui, JSON.parse(localStorage.getItem(STORE + ":ui") || "{}"), { next: null, edit: null }); } catch (e) {}
const saveUi = () => { try { localStorage.setItem(STORE + ":ui", JSON.stringify({ tab: ui.tab, open: ui.open, src: ui.src })); } catch (e) {} };

/* ── pictures: IndexedDB blobs, or "url:" files that ship with the app ── */
const IDB = {
  db: null,
  open() { return this.db || (this.db = new Promise((ok, no) => { const r = indexedDB.open(STORE, 1); r.onupgradeneeded = () => r.result.createObjectStore("pics"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); })); },
  async run(mode, fn) { const d = await this.open(); return new Promise((ok, no) => { const tx = d.transaction("pics", mode); const r = fn(tx.objectStore("pics")); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => no(tx.error); }); },
  put(id, blob) { return this.run("readwrite", s => s.put(blob, id)); },
  get(id) { return this.run("readonly", s => s.get(id)); },
  del(id) { return this.run("readwrite", s => s.delete(id)); }
};
const picUrls = {};
async function picSrc(id) {
  if (id.startsWith("url:")) return id.slice(4);
  if (picUrls[id]) return picUrls[id];
  try { const b = await IDB.get(id); if (b) return (picUrls[id] = URL.createObjectURL(b)); } catch (e) {}
  return "";
}
function hydratePics() { document.querySelectorAll("img[data-pic]").forEach(async im => { if (!im.src) im.src = await picSrc(im.dataset.pic); }); }
function shrinkImage(file) { // phone photos are big: keep them at 1600 px on the long side
  return new Promise(ok => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => ok(b || file), "image/jpeg", .86); URL.revokeObjectURL(img.src);
    }; img.onerror = () => ok(file); img.src = URL.createObjectURL(file);
  });
}

/* ══ the numbers: everything worked out from the sheet plus what's on right now ══ */
const prof = c => +c.profBonus || (2 + Math.floor(((+c.level || 1) - 1) / 4));
const mod = (c, ab) => abMod(c.ab[ab]);
const debtExh = c => Math.floor((+c.debtCp || 0) / 10000);
const exhOf = c => Math.min(6, (+c.exh || 0) + debtExh(c));
// every bonus in force: effects that are on, and items that grant one (attuned, if they need it)
function activeMods(c) {
  const out = c.effects.filter(e => e.on !== false).map(e => ({ ...e, src: "effect" }));
  for (const it of c.items) if (!it.gone && it.mods && (!it.attune || it.attuned)) for (const m of it.mods) out.push({ ...m, name: it.name, src: "item" });
  for (const t of c.traits) for (const e of t.fx || []) if (e.t === "bonus" && e.bonus) out.push({ to: [e.to], bonus: e.bonus, name: t.name, src: "feature" });
  return out;
}
function hits(tok, ctx) {
  if (tok === ctx.kind) return true;
  if (tok === "rdmg" && ctx.kind === "dmg" && ctx.str) return true;     // Rage: a Strength attack's damage
  if (ctx.kind === "atk" && ((tok === "satk" && ctx.spell) || (tok === "watk" && !ctx.spell))) return true;
  if (ctx.kind === "init" && (tok === "check" || tok === "check:dex")) return true;
  if (tok === ctx.kind + ":" + ctx.ab) return true;
  if (ctx.kind === "check" && ctx.skill && tok === "skill:" + ctx.skill) return true;
  return false;
}
const modsFor = (c, ctx) => activeMods(c).filter(m => (m.to || []).some(t => hits(t, ctx)) && m.bonus);
const flatFor = (c, ctx) => modsFor(c, ctx).reduce((a, m) => a + flatOf(m.bonus), 0);
const diceFor = (c, ctx) => modsFor(c, ctx).filter(m => isDice(m.bonus));
const acOf = c => (+c.ac || 10) + flatFor(c, { kind: "ac" });
const castAb = c => c.castAb || "wis";
const dcOf = (c, sp) => 8 + prof(c) + mod(c, castAbFor(c, sp)) + flatFor(c, { kind: "dc" });
const satkOf = (c, sp) => prof(c) + mod(c, castAbFor(c, sp)) + flatFor(c, { kind: "atk", spell: true });
const initOf = c => mod(c, "dex") + (+c.initBonus || 0) + flatFor(c, { kind: "init" }) + alertInit(c);
function hpMaxOf(c) { let m = (+c.hpMax || 1) + flatFor(c, { kind: "hpmax" }); if (exhOf(c) >= 4) m = Math.floor(m / 2); return Math.max(1, m); }
function speedOf(c) { const e = exhOf(c); let s = (+c.speed || 30) + flatFor(c, { kind: "speed" }); if (e >= 5 || c.conds.includes("Grappled") || c.conds.includes("Restrained")) return 0; if (e >= 2) s = Math.floor(s / 2); return s; }
const saveOf = (c, ab) => mod(c, ab) + (c.saveProf.includes(ab) ? prof(c) : 0) + flatFor(c, { kind: "save", ab });
const skillLv = (c, k) => +(c.skills[k] || 0); // 0, 1 proficient, 2 expertise, .5 half
const joat = (c, k) => !skillLv(c, k) && bardLv(c) >= 2 ? Math.floor(prof(c) / 2) : 0;     // a Bard's Jack of All Trades: half the Proficiency Bonus on a skill they lack
const skillOf = (c, k) => mod(c, SKILL[k].ab) + Math.floor(prof(c) * skillLv(c, k)) + joat(c, k) + flatFor(c, { kind: "check", ab: SKILL[k].ab, skill: k });
const passiveOf = (c, k) => 10 + skillOf(c, k);
function atkAb(c, a) { return a.ab === "best" ? (mod(c, "dex") > mod(c, "str") ? "dex" : "str") : (a.ab || "str"); }
// an attack as written on a sheet: its own to-hit (or a save and DC) and its own damage, not worked out from the scores
const asWritten = a => (a.hit !== undefined && a.hit !== null && a.hit !== "") || !!a.save || !!a.dmgx;
const rollsToHit = a => !asWritten(a) || (a.hit !== undefined && a.hit !== null && a.hit !== "" && !a.save);
const atkOf = (c, a) => (asWritten(a) ? (+a.hit || 0) : mod(c, atkAb(c, a)) + (a.prof !== false ? prof(c) : 0) + (+a.bonus || 0)) + flatFor(c, { kind: "atk", spell: false });
const dmgOfAtk = (c, a) => asWritten(a) ? String(a.dmgx || "") : tidyDice(addDice(a.dice, String(mod(c, atkAb(c, a)) + (+a.bonus || 0))));
const res = (c, name) => c.res.find(r => r.name === name);
const resLeft = r => r ? Math.max(0, (+r.max || 0) - (+r.used || 0)) : 0;
const attunedCount = c => c.items.filter(i => !i.gone && i.attuned).length;

// advantage the rules hand you, before you choose (conditions, exhaustion, effects like the Blessing)
function autoMode(c, ctx) {
  const adv = [], dis = []; const has = k => c.conds.includes(k); const e = exhOf(c);
  if (ctx.kind === "atk") { ["Blinded", "Frightened", "Poisoned", "Prone", "Restrained"].forEach(k => has(k) && dis.push(k)); if (has("Invisible")) adv.push("Invisible"); if (e >= 3) dis.push("Exhaustion " + e); }
  if (ctx.kind === "check" || ctx.kind === "init") { ["Frightened", "Poisoned"].forEach(k => has(k) && dis.push(k)); if (e >= 1) dis.push("Exhaustion " + e); }
  if (ctx.kind === "save") { if (e >= 3) dis.push("Exhaustion " + e); if (ctx.ab === "dex" && has("Restrained")) dis.push("Restrained"); }
  for (const m of activeMods(c)) { if ((m.adv || []).some(t => hits(t, ctx))) adv.push(m.name); if ((m.dis || []).some(t => hits(t, ctx))) dis.push(m.name); }
  { const bl = barbLv(c), incap = ["Incapacitated", "Paralyzed", "Petrified", "Stunned", "Unconscious"].some(has);     // the Barbarian (2026-11-06)
    if (bl >= 2 && ctx.kind === "save" && ctx.ab === "dex" && !incap) adv.push("Danger Sense");
    if (bl >= 7 && ctx.kind === "init") adv.push("Feral Instinct"); }
  return { mode: adv.length && !dis.length ? "adv" : dis.length && !adv.length ? "dis" : "normal", adv, dis };
}

/* ── purse and divine debt (the Auspicious Cart's Pious Wager) ── */
const COIN = { cp: 1, sp: 10, ep: 50, gp: 100, pp: 1000 };
const purseCp = p => Object.keys(COIN).reduce((a, k) => a + (+p[k] || 0) * COIN[k], 0);
const gpText = cp => { const g = cp / 100; return (Number.isInteger(g) ? g : g.toFixed(2)) + " gp"; };
function payCp(p, cost) { // pays from the purse, breaking a coin for change if it must; returns what it couldn't pay
  let left = cost;
  for (const k of ["gp", "pp", "ep", "sp", "cp"]) { const n = Math.min(+p[k] || 0, Math.floor(left / COIN[k])); p[k] = (+p[k] || 0) - n; left -= n * COIN[k]; }
  if (left > 0) for (const k of ["cp", "sp", "ep", "gp", "pp"]) if ((+p[k] || 0) > 0 && COIN[k] > left) {
    p[k]--; let change = COIN[k] - left; left = 0;
    for (const s of ["gp", "sp", "cp"]) { const n = Math.floor(change / COIN[s]); p[s] = (+p[s] || 0) + n; change -= n * COIN[s]; }

  }
  return left;
}

const WAGER = [

function spellsHtml(c) {

    ${Object.keys(c.slots).filter(k => c.slots[k].max).map(k => `<div class="stat"><b>${c.slots[k].max - c.slots[k].used}/${c.slots[k].max}</b><small>${ord(+k)} slots</small></div>`).join("")}${c.pactSlots ? `<div class="stat"><b>${c.pactSlots.max - c.pactSlots.used}/${c.pactSlots.max}</b><small>Pact (${ord(c.pactSlots.lvl)})</small></div>` : ""}</div>
    ${flatFor(c, { kind: "dc" }) ? `<p class="note">Includes ${modsFor(c, { kind: "dc" }).map(m => `${esc(m.name)} ${esc(sg(flatOf(m.bonus)))}`).join(", ")} (attuned).</p>` : ""}
    ${c.conc ? `<p class="warn">Concentrating on ${esc(c.conc)}.</p>` : ""}</div>`;
  const card = s => {
    if (EM()) return `<div class="card">${spellForm(c, s)}</div>`;
    const avail = Object.keys(c.slots).filter(k => +k >= s.lvl && c.slots[k].max).map(Number);
    const firstFree = avail.find(k => c.slots[k].used < c.slots[k].max);
    return `<div class="card"><span class="nm">${esc(s.name)}${s.tag ? `<span class="tag ${s.tag === "D" ? "g" : ""}">${esc(s.tag === "D" ? "Domain · always prepared" : s.tag)}</span>` : ""}${s.conc ? `<span class="tag c">Concentration</span>` : ""}${isMulti(c) && s.cls ? `<span class="tag">${esc(s.cls)}</span>` : ""}</span>
      <span class="sub">${esc([s.time, s.range, s.dur].filter(Boolean).join(" · "))}</span>
      <div class="txt">${fmt(s.text)}</div>
      ${s.roll ? `<span class="sub">${s.roll.kind === "atk" ? `Spell attack ${sg(satkOf(c, s))}, ` : s.roll.kind === "save" ? `${AB_NAME[s.roll.save]} save DC ${dcOf(c, s)}, ` : ""}${esc(spellExpr(c, s, s.lvl))} ${esc(s.roll.kind === "heal" ? "healing" : s.roll.type || "")}${s.roll.up ? ` · ${s.roll.up} more per ${s.roll.upEvery ? s.roll.upEvery + " slot levels" : "slot level"} above ${ord(s.lvl)}` : ""}</span>` : ""}
      <div class="acts">${s.lvl === 0 ? `<button class="btn small main" data-act="castq" data-id="${s.id}">Cast</button>`
        : `<select data-castlvl="${s.id}" style="width:auto">${avail.map(k => `<option value="${k}" ${k === firstFree ? "selected" : ""}>${ord(k)} level (${c.slots[k].max - c.slots[k].used} left)</option>`).join("")}${c.pactSlots && c.pactSlots.lvl >= s.lvl ? `<option value="p" ${!firstFree ? "selected" : ""}>Pact slot, ${ord(c.pactSlots.lvl)} level (${c.pactSlots.max - c.pactSlots.used} left)</option>` : ""}</select><button class="btn small main" data-act="cast" data-id="${s.id}" ${firstFree || (c.pactSlots && c.pactSlots.lvl >= s.lvl && c.pactSlots.used < c.pactSlots.max) ? "" : "disabled"}>Cast</button>`}

// a dropdown for the sheet, like the survey's sheetPick: the list, whatever's there already kept, and Other… to type your own
function pick(label, path, list, cur) {
  const has = !cur || list.includes(cur);
  return `<label class="fld"><span>${label}</span><select data-f="${path}"><option value="">—</option>${list.map(v => `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("")}${has ? "" : `<option selected>${esc(cur)}</option>`}<option value="__other">Other…</option></select></label>`;

// homebrew: the survey's library, brought in from its "Send to the Field Book" file or a survey save
// and the Field Book on this device (Joseph, 2026-11-01): the same website, so its storage is readable here; its items
// and spells, always current, without its DM notes. The same entry in both: the more recently edited one.
const fbData = () => { try { return JSON.parse(localStorage.getItem("fieldbook") || "null"); } catch (e) { return null; } };
const fromFB = cat => { const o = fbData(); return o && Array.isArray(o[cat]) ? o[cat].filter(x => x && String(x.name || "").trim()).map(x => { const y = { ...x, fb: true }; delete y.notes; return y; }) : []; };
const mergeHb = (a, b) => { const by = new Map(a.map(x => [x.id, x])); for (const x of b) { const o = by.get(x.id); if (!o || (x.fbEdited || 0) > (o.fbEdited || 0)) by.set(x.id, x); } return [...by.values()]; };
const libSpells = () => mergeHb((db.lib && db.lib.spells) || [], fromFB("spells")), libLoot = () => mergeHb((db.lib && db.lib.loot) || [], fromFB("loot"));
function takeLibrary(d) {
  const src = d && d.format === "ordinate-fieldbook" ? d : d && d.library ? d.library : null;
  if (!src) return null;
  // the library's notes are the DM's (who it's for, where it's hidden): they never come across
  const clean = x => { const y = { ...x }; delete y.notes; return y; };
  return { spells: (src.spells || []).map(clean), loot: (src.loot || []).map(clean), from: d.campaign || d.title || (d.survey && d.survey.title) || "", at: today() };
}
// edit mode: the homebrew's own entries (name and text), and taking one out

/* installing it on a phone (Joseph, 2026-11-01: Chrome said it was installed when it wasn't, and only offered the
   browser). Chrome hands over beforeinstallprompt when it will install: then an Install button; otherwise, outside the
   installed app, a line on how, and what to do when Chrome thinks it's already installed. */
let installEvt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function showInstall() {
  const el = $("#install"); if (!el) return;
  if (standalone() || location.protocol !== "https:") { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = installEvt ? `<button class="btn small main" data-act="install">Install the app</button> <span class="note" style="margin:0">It works offline once it's installed.</span>`
    : `<details class="note" style="margin:0"><summary>Install it as an app</summary>In Chrome: ⋮ → <b>Install app</b> (or Add to Home screen). If you opened this from another app's link, open it in Chrome first.
      If Chrome says it's already installed but it isn't on your home screen: Android Settings → Apps → Character Book → Uninstall, then come back here.</details>`;
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; showInstall(); toast("Installed: it's on your home screen, and works offline."); });
document.addEventListener("click", async e => {
  if (!e.target.closest || !e.target.closest('[data-act="install"]') || !installEvt) return;
  const ev = installEvt; installEvt = null; ev.prompt(); try { await ev.userChoice; } catch (x) {} showInstall();
});
showInstall();
// a device set up from another's QR code: the address carries the token and gist after #; keep them, clear the address, sync
if (location.hash.startsWith("#sync=")) {
  try { const s = JSON.parse(atob(decodeURIComponent(location.hash.slice(6)))); if (s.t) { setSyncCfg({ token: s.t, gistId: s.g || "" }); toast("Sync is set up on this device: bringing your sheets in…", 4000); setTimeout(doSync, 300); } } catch (e) { toast("That code didn't read: make a new one on the other device."); }
  history.replaceState(null, "", location.pathname);
}
